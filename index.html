<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gado.love ♥</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(circle at 50% 40%, #ffe3ec 0%, #ffc2d4 45%, #ff8fab 100%);
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    cursor: pointer; user-select: none;
  }
  .couple {
    display: flex; align-items: center; justify-content: center;
    gap: clamp(8px, 3vw, 40px); z-index: 2;
  }
  .name {
    color: #c9184a; font-size: clamp(36px, 12vw, 160px); font-weight: 900;
    text-shadow: 0 6px 20px rgba(255, 255, 255, .6);
    white-space: nowrap;
  }
  .heart {
    width: clamp(70px, 26vw, 360px); height: clamp(70px, 26vw, 360px);
    animation: beat 1.1s ease-in-out infinite;
    filter: drop-shadow(0 12px 30px rgba(200, 0, 60, .35));
    z-index: 2;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.15); }
    30% { transform: scale(1); }
    45% { transform: scale(1.1); }
  }
  .label {
    position: fixed; bottom: 8vh; left: 0; right: 0; text-align: center;
    color: #c9184a; font-size: clamp(20px, 5vw, 36px); font-weight: 700; letter-spacing: .05em;
    z-index: 2;
  }
  .float {
    position: fixed; bottom: -40px; pointer-events: none; z-index: 1;
    animation: rise linear forwards;
  }
  @keyframes rise {
    to { transform: translateY(-115vh) rotate(var(--r)); opacity: 0; }
  }
</style>
</head>
<body>
  <div class="couple">
  <span class="name">가연</span>
  <svg class="heart" viewBox="0 0 32 29.6" aria-label="heart">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ff4d6d"/>
        <stop offset="1" stop-color="#c9184a"/>
      </linearGradient>
    </defs>
    <path fill="url(#g)" d="M23.6 0c-3.4 0-6.3 2.7-7.6 5.6C14.7 2.7 11.8 0 8.4 0 3.8 0 0 3.8 0 8.4c0 9.4 9.5 11.9 16 21.2 6.1-9.3 16-12.1 16-21.2C32 3.8 28.2 0 23.6 0z"/>
  </svg>
  <span class="name">도연</span>
  </div>

<script>
  const emojis = ["❤️", "💖", "💕", "💗", "💓", "💘"];
  function spawn(x) {
    const el = document.createElement("div");
    el.className = "float";
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = (x ?? Math.random() * window.innerWidth) + "px";
    el.style.fontSize = (16 + Math.random() * 32) + "px";
    el.style.animationDuration = (4 + Math.random() * 4) + "s";
    el.style.setProperty("--r", (Math.random() * 120 - 60) + "deg");
    document.body.appendChild(el);
    el.addEventListener("animationend", () => el.remove());
  }
  setInterval(spawn, 250);
  // 클릭/터치하면 하트 폭발
  document.addEventListener("pointerdown", e => {
    for (let i = 0; i < 12; i++) spawn(e.clientX + (Math.random() * 120 - 60));
  });
</script>
</body>
</html>
